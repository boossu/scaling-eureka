<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes">
<title>书籍阅读器</title>
<style>
/* Theme tokens: same as the manga reader / beautified web console */
:root{
  color-scheme:dark;
  --bg:#0b0d0f; --surface:#15181b; --surface2:#1e2225; --surface3:#272c30;
  --text:#eef1ee; --dim:#9aa39b; --faint:#666e67; --border:#262c2f;
  --accent:#3dd68c; --accent-dim:#123325; --fill-gs:#0e9f6e;
  --warm:#f2a93b; --warm-dim:#38280e; --fill-mt:#d97c16;
  --amber:#e8a33d; --bad:#e5604f; --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;min-height:2.25rem;border:none;background:none;color:inherit;cursor:pointer}
input{font-family:inherit}
img{display:block}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#app{max-width:72rem;margin:0 auto;padding:0 12px 96px}
.hidden{display:none!important}
/* ---------- header ---------- */
.bk-head{display:flex;align-items:baseline;gap:8px;padding-top:16px}
.bk-head h1{font-size:20px;font-weight:700;color:#fff}
.bk-head p{font-size:12px;color:var(--dim)}
.bk-head .ver{margin-left:auto;font-size:11px;color:var(--faint)}
/* ---------- rule cards ---------- */
#rules{padding-top:12px}
.rule-row{display:flex;flex-wrap:wrap;gap:10px}
.rule-card{flex:1;min-width:160px;display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1px solid var(--border);background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.25);text-align:left;transition:all .15s}
.rule-card:active{transform:scale(.98)}
.rule-card.active-wn{border-color:#d97706;background:rgba(217,119,6,.14);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.rule-card.active-gx{border-color:#991b1b;background:rgba(153,27,27,.18);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.rule-badge{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:20px;font-weight:700;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.rule-badge.wn{background:#d97706}
.rule-badge.gx{background:#991b1b}
.rule-meta{min-width:0;flex:1}
.rule-title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:600;color:#fff}
.rule-author{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--dim)}
.rule-file{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;color:var(--faint);font-family:ui-monospace,Menlo,Consolas,monospace}
.rule-dot{flex:none;width:8px;height:8px;border-radius:50%;margin-left:auto}
.rule-dot.wn{background:#d97706}
.rule-dot.gx{background:#991b1b}
/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:16px}
.chip{border-radius:9999px;padding:6px 14px;font-size:14px;background:var(--surface);color:var(--dim);box-shadow:inset 0 0 0 1px var(--border);transition:all .15s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--accent-dim);color:var(--accent);font-weight:600;box-shadow:inset 0 0 0 1px var(--accent)}
.grp-h{flex:none;width:100%;margin-top:8px;font-size:12px;font-weight:700;color:var(--dim)}
/* ---------- search ---------- */
.search-row{display:flex;gap:8px;padding-top:12px}
.search-in{flex:1;min-width:0;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding:8px 12px;font-size:14px;color:var(--text);outline:none}
.search-in:focus{border-color:var(--accent)}
.search-in::placeholder{color:var(--faint)}
.search-btn{flex:none;border-radius:12px;background:var(--accent-dim);padding:8px 16px;font-size:14px;font-weight:600;color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.search-btn:active{transform:scale(.95)}
.search-note{margin-top:8px;font-size:14px;color:var(--amber)}
.search-na{margin-top:12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding:10px 12px;font-size:14px;color:var(--dim)}
/* ---------- book list ---------- */
.sec{padding-top:16px}
.count{margin-bottom:8px;font-size:12px;color:var(--faint)}
.book-list{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.book-list{grid-template-columns:repeat(2,1fr)}}
.book-card{display:flex;gap:12px;border-radius:16px;border:1px solid var(--border);background:var(--surface);padding:12px;text-align:left;box-shadow:0 4px 16px rgba(0,0,0,.3);transition:all .15s}
.book-card:active{transform:scale(.99)}
.book-card:hover{border-color:var(--faint)}
.bcover{position:relative;flex:none;width:64px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--surface2);box-shadow:0 4px 14px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.05)}
.bcover img{width:100%;height:100%;object-fit:cover}
.bcover .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--surface2);color:var(--dim)}
.bcover .ph b{font-size:24px;color:var(--faint)}
.bcover .ph span{font-size:10px;line-height:1.2;text-align:center;padding:0 4px}
.bcover.loading{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.bmeta{flex:1;min-width:0}
.b-title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;font-weight:700;color:#fff}
.b-sub{display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--dim)}
.b-desc{display:block;margin-top:4px;font-size:12px;line-height:1.6;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pager{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:12px}
.pager button{border-radius:9999px;background:var(--surface);padding:6px 16px;font-size:14px;box-shadow:inset 0 0 0 1px var(--border)}
.pager button:active{transform:scale(.95)}
.pager button:disabled{opacity:.4}
.pager span{font-size:14px;color:var(--dim)}
.loading{padding:32px 0;text-align:center;font-size:14px;color:var(--dim)}
.empty{border:1px dashed var(--border);border-radius:16px;background:var(--surface);padding:40px 16px;text-align:center}
.empty b{display:block;font-size:24px;color:var(--faint)}
.empty p{margin-top:8px;font-size:14px;color:var(--dim)}
.err-panel{border-radius:16px;border:1px solid var(--border);background:var(--surface);padding:16px}
.err-panel .bad{font-size:14px;color:var(--bad)}
.err-panel .hint{margin-top:8px;font-size:14px;line-height:1.7;color:var(--dim)}
.err-panel button{margin-top:12px;border-radius:9999px;background:var(--surface2);padding:6px 16px;font-size:14px;box-shadow:inset 0 0 0 1px var(--border)}
.err-panel button:active{transform:scale(.95)}
/* ---------- detail ---------- */
.back-btn{margin-bottom:12px;border-radius:9999px;background:var(--surface);padding:6px 16px;font-size:14px;box-shadow:inset 0 0 0 1px var(--border)}
.back-btn:active{transform:scale(.95)}
.panel{border-radius:16px;border:1px solid var(--border);background:var(--surface);padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.panel-top{display:flex;gap:16px}
.bcover-lg{position:relative;flex:none;width:128px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--surface2);box-shadow:0 4px 14px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.05)}
.bcover-lg img{width:100%;height:100%;object-fit:cover}
.bcover-lg .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--surface2);color:var(--dim)}
.bcover-lg .ph b{font-size:24px;color:var(--faint)}
.bcover-lg .ph span{font-size:10px;line-height:1.2;text-align:center;padding:0 4px}
.panel h2{font-size:20px;font-weight:700;line-height:1.4;color:#fff}
.panel .author{margin-top:6px;font-size:14px;color:var(--dim)}
.kind-chip{display:inline-block;margin-top:8px;border-radius:9999px;background:var(--accent-dim);padding:2px 10px;font-size:12px;font-weight:500;color:var(--accent)}
.panel .wc{margin-top:6px;font-size:14px;color:var(--dim)}
.panel-meta{margin-top:8px;font-size:11px;color:var(--faint);font-family:ui-monospace,Menlo,Consolas,monospace}
.panel-desc{margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:14px;line-height:1.7;color:var(--dim)}
.panel-last{margin-top:8px;font-size:14px;color:var(--dim)}
.ch-head{display:flex;align-items:center;gap:8px;margin-top:20px}
.ch-head h3{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:#fff}
.ch-head h3::before{content:"";width:4px;height:16px;border-radius:9999px;background:var(--accent)}
.ch-head .cnt{font-size:12px;font-weight:400;color:var(--faint)}
.ch-head button{margin-left:auto;border-radius:9999px;background:var(--surface);padding:6px 14px;font-size:12px;box-shadow:inset 0 0 0 1px var(--border)}
.ch-head button:active{transform:scale(.95)}
.ch-grid{margin-top:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:52vh;overflow-y:auto;padding-right:4px}
@media(min-width:640px){.ch-grid{grid-template-columns:repeat(6,1fr)}}
.ch-grid button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:8px;background:var(--surface);padding:10px 6px;font-size:12px;text-align:center;box-shadow:inset 0 0 0 1px var(--border);transition:all .15s}
.ch-grid button:active{transform:scale(.97)}
/* ---------- reader ---------- */
#reader{padding-top:12px}
.r-top{position:sticky;top:8px;z-index:20;border-radius:16px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.55);padding:8px 12px;box-shadow:0 8px 24px rgba(0,0,0,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.r-top-row{display:flex;align-items:center;gap:8px}
.r-top-row .r-back{flex:none;border-radius:9999px;background:rgba(255,255,255,.1);padding:6px 14px;font-size:14px;color:#fff}
.r-top-row .r-back:active{transform:scale(.95)}
.r-mid{flex:1;min-width:0;text-align:center}
.r-mid .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:600;color:#fff}
.r-mid .s{font-size:11px;color:rgba(255,255,255,.6);font-family:ui-monospace,Menlo,Consolas,monospace}
.r-top-row .r-navb{flex:none;border-radius:9999px;background:rgba(255,255,255,.1);padding:6px 12px;font-size:12px;color:#fff}
.r-top-row .r-navb:active{transform:scale(.95)}
.r-top-row .r-navb:disabled{opacity:.4}
.r-text{max-width:42rem;margin:16px auto 0;border-radius:16px;border:1px solid var(--border);background:var(--surface);padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.r-text p{white-space:pre-wrap;font-size:17px;line-height:1.9;color:var(--text)}
.r-err{padding:24px 0;text-align:center}
.r-err .bad{font-size:14px;color:var(--bad)}
.r-err button{margin-top:12px;border-radius:9999px;background:var(--surface2);padding:6px 16px;font-size:14px;box-shadow:inset 0 0 0 1px var(--border)}
.r-bottom{max-width:42rem;margin:16px auto 0;display:flex;align-items:center;justify-content:center;gap:12px;padding-bottom:8px}
.r-bottom button{border-radius:9999px;background:var(--surface);padding:8px 16px;font-size:14px;box-shadow:inset 0 0 0 1px var(--border)}
.r-bottom button:active{transform:scale(.95)}
.r-bottom button:disabled{opacity:.4}
.r-bottom button.primary{background:var(--accent-dim);color:var(--accent);font-weight:600;box-shadow:inset 0 0 0 1px var(--accent)}
/* ---------- toast & log ---------- */
#toast{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:0 24px;pointer-events:none}
#toast .in{max-width:86vw;border-radius:9999px;background:rgba(0,0,0,.75);padding:10px 20px;text-align:center;font-size:14px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.15);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#log{margin-top:16px;border-radius:16px;border:1px solid var(--border);background:var(--surface);overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#log .lh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
#log .lh h2{font-size:13px;font-weight:600;color:var(--dim)}
#log .lh h2 span{font-size:11px;color:var(--faint);font-family:ui-monospace,Menlo,Consolas,monospace}
#log .lh .btns{display:flex;gap:6px}
#log .lh button{border-radius:9999px;padding:4px 10px;font-size:12px;color:var(--dim);box-shadow:inset 0 0 0 1px var(--border)}
#log ol{max-height:46vh;overflow-y:auto;border-top:1px solid var(--border);padding:6px 12px;list-style:none}
#log li{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);padding:6px 0}
#log li:last-child{border-bottom:none}
#log .dot{flex:none;width:6px;height:6px;border-radius:50%}
#log .dot.ok{background:var(--accent)}
#log .dot.bad{background:var(--bad)}
#log .tm{flex:none;font-size:11px;color:var(--faint);font-family:ui-monospace,Menlo,Consolas,monospace}
#log .lb{flex:none;font-size:12px;font-weight:500}
#log .dt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--dim)}
#log .dt.bad{color:var(--bad)}
#log .ms{flex:none;font-size:10px;color:var(--faint);font-family:ui-monospace,Menlo,Consolas,monospace}
#log .none{padding:16px 0;text-align:center;font-size:12px;color:var(--faint)}
</style>
</head>
<body>

</div>

/* 直接 fetch，不走任何代理。GBK 站取 arrayBuffer 后 TextDecoder("gbk") 解码。
   HTTP 错误（404/403 等）不重试，立即如实报错；只有网络异常才重试 2 次。
   真浏览器里 fetch 的 User-Agent 是禁设头（浏览器忽略，改用浏览器自身的 UA）；
   node/jsdom 自测里则由这行送出真 UA。 */
function decodeBody(buf, charset) {

function request(label, url, opts, summarize) {
  opts = opts || {};

  var headers = { "Accept": "text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8", "Accept-Language": "zh-CN,zh;q=0.9" };
  if (opts.ua === "desktop") headers["User-Agent"] = DESKTOP_UA;
  else if (opts.ua === "mobile") headers["User-Agent"] = MOBILE_UA;
  if (opts.headers) for (var k in opts.headers) headers[k] = opts.headers[k];

    var fetchOpts = { headers: headers, signal: AbortSignal.timeout(30000) };
    if (opts.method) fetchOpts.method = opts.method;
    if (opts.body) fetchOpts.body = opts.body;
    return fetch(url, fetchOpts).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.arrayBuffer().then(function (buf) {
        var text = decodeBody(buf, opts.charset || "utf-8");
        var extra = "";
        if (summarize) { try { extra = summarize(text) || ""; } catch (e) { extra = ""; } }
        pushLog({ label: label, url: url, ok: true, detail: "HTTP " + res.status + " · " + text.length + " 字符" + (extra ? " · " + extra : "") + (n > 1 ? " · 第 " + n + " 次重试成功" : ""), ms: Date.now() - t0 });
        return text;

      if (!isHttp && n < 3) {

      }
      pushLog({ label: label, url: url, ok: false, detail: ((e && e.message) ? e.message : String(e)) + (isHttp ? "" : "（已重试 2 次）"), ms: Date.now() - t0 });

/* 直接 <img> 加载封面：成功显示图，失败留首字占位（手机 IP 不被 CDN 拦时正常出图） */
function imgHtml(src, alt, cls) {
  var initial = (String(alt || "书").trim().charAt(0) || "书");
  if (!src) return '<div class="' + cls + '"><div class="ph"><b>' + esc(initial) + '</b><span>无图</span></div></div>';
  return '<div class="' + cls + '" data-src="' + esc(src) + '" data-alt="' + esc(alt || "") + '"><div class="ph"><b>' + esc(initial) + '</b><span>加载中</span></div></div>';
}
function bindImgs(root) {
  var holders = (root || document).querySelectorAll("[data-src]");
  for (var i = 0; i < holders.length; i++) {
    (function (h) {
      var src = h.getAttribute("data-src"), alt = h.getAttribute("data-alt") || "";
      var im = new Image();
      im.alt = alt;
      im.onload = function () {
        h.innerHTML = "";
        im.style.width = "100%"; im.style.height = "100%"; im.style.objectFit = "cover";
        h.appendChild(im);
      };
      im.onerror = function () {
        var initial = (alt.trim().charAt(0) || "书");
        h.innerHTML = '<div class="ph"><b>' + esc(initial) + '</b><span>图片加载失败</span></div>';
      };

}

/* ---------------- 列表加载 ---------------- */

  }).catch(function (e) { b.loading = false; b.cards = []; b.hasMore = false; b.error = (e && e.message) || String(e); render(); });
}
function loadGuoxueCategory(path) {
  var b = state.browse;

function loadCategory(ruleId, k, page) {

/* 无奈搜索：按规则 POST searchkey（另带站方表单隐藏字段 action=login）。
   实测站方忽略关键词、恒返热门列表：标题里没一个含关键词时如实提示。 */
function doWnSearch() {
  var inp = $("wnQuery");
  var key = inp ? inp.value.replace(/^\s+|\s+$/g, "") : "";
  if (!key) return;
  var b = state.browse;
  b.loading = true; b.error = ""; b.nav = "search"; b.page = 1; b.searchNote = ""; render();
  request("搜索·无奈书库", wnSearchUrl(), { method: "POST", body: wnSearchBody(key), ua: "desktop", charset: "gbk" }, function (t) { return wnParseList(t, WN_HOST).length + " 本"; }).then(function (html) {
    var cards = wnParseList(html, WN_HOST);

    var note = (cards.length > 0 && !hasKey) ? "本站搜索未按关键词过滤，返回的是热门列表（实测）" : "";

/* ---------------- 详情与章节 ---------------- */

  var card = state.browse.cards[i];

  var isWn = state.ruleId === "wunai";
  state.detailLoading = card.title; render();
  request("详情·" + card.title, card.ref, isWn ? { ua: "desktop", charset: "gbk" } : { headers: GX_HEADERS }, function (t) {
    var d = isWn ? wnParseDetail(t, card.ref) : gxParseDetail(t, card.ref);
    return ((d && d.chapters) ? d.chapters.length : 0) + " 章";
  }).then(function (html) {
    var detail = isWn ? wnParseDetail(html, card.ref) : gxParseDetail(html, card.ref);
    if (!detail) throw new Error("详情没解析出书名");
    state.detailLoading = "";
    state.view = { kind: "detail", detail: detail, ruleId: state.ruleId };
    render();
  }).catch(function (e) { state.detailLoading = ""; showToast((e && e.message) || String(e)); render(); });
}

  var v = state.view;

  var detail = v.detail, ruleId = v.ruleId;
  var ch = detail.chapters[index];
  if (!ch) return;
  if (v.kind === "reader") { v.loading = true; v.error = ""; render(); }
  else state.view = { kind: "reader", detail: detail, ruleId: ruleId, index: index, text: "", nextUrl: "", pageNo: 1, loading: true, error: "" };
  var view = state.view;
  request("章节·" + ch.name, ch.id, ruleId === "wunai" ? { ua: "desktop", charset: "gbk" } : { headers: GX_HEADERS }).then(function (html) {
    var parsed = ruleId === "wunai" ? wnParseChapter(html, ch.id) : gxParseChapter(html);
    if (!parsed.text) throw new Error("章节没解析出正文");
    state.view = { kind: "reader", detail: detail, ruleId: ruleId, index: index, text: parsed.text, nextUrl: parsed.nextUrl, pageNo: 1, loading: false, error: "" };
    render();
    var top = $("readerTop"); if (top && top.scrollIntoView) top.scrollIntoView();
  }).catch(function (e) {
    if (state.view.kind === "reader") { state.view.loading = false; state.view.error = (e && e.message) || String(e); render(); }
  });
}
function loadNextPage() {
  var v = state.view;
  if (v.kind !== "reader" || !v.nextUrl || v.loading) return;
  v.loading = true; v.error = ""; render();
  request("章节·下一页", v.nextUrl, v.ruleId === "wunai" ? { ua: "desktop", charset: "gbk" } : { headers: GX_HEADERS }).then(function (html) {
    var parsed = v.ruleId === "wunai" ? wnParseChapter(html, v.nextUrl) : gxParseChapter(html);
    if (!parsed.text) throw new Error("下一页没解析出正文");
    if (state.view.kind !== "reader") return;
    state.view.loading = false;
    state.view.text = state.view.text + "\n\n" + parsed.text;
    state.view.nextUrl = parsed.nextUrl;
    state.view.pageNo = state.view.pageNo + 1;
    render();
  }).catch(function (e) {
    if (state.view.kind === "reader") { state.view.loading = false; state.view.error = (e && e.message) || String(e); render(); }
  });
}
function readerPrev() {
  var v = state.view;

}

  var v = state.view;

    html += '<div class="r-bottom"><button type="button" ' + (v.index <= 0 ? "disabled" : "") + ' onclick="readerPrev()">‹ 上一章</button>';
    if (v.nextUrl) {
      html += '<button type="button" class="primary" ' + (v.loading ? "disabled" : "") + ' onclick="loadNextPage()">' + (v.loading ? "取下一页…" : "下一页 ›") + '</button>';
    } else {
      html += '<button type="button" class="primary" ' + (v.index >= total - 1 ? "disabled" : "") + ' onclick="readerNext()">下一章 ›</button>';
    }
    html += '</div>';
  }
  html += '</section>';
  return html;
}
function render() {
  renderRuleRow();
  var main = $("main");
  var v = state.view;
  if (v.kind === "detail") main.innerHTML = renderDetail();
  else if (v.kind === "reader") main.innerHTML = renderReader();
  else main.innerHTML = renderBrowse();
  /* 搜索框的值：重渲染会丢输入，读回来补上（只在浏览态） */
  var b = state.browse;
  var inp = $("wnQuery");
  if (inp && document.activeElement !== inp) inp.value = b.query || "";
  bindImgs(main);
}
/* 搜索框输入时同步 state.query（重渲染不丢关键词；回车/点搜索用它） */
document.addEventListener("input", function (e) {
  var t = e.target;
  if (t && t.id === "wnQuery") state.browse.query = t.value;
});

  state.logOpen = !state.logOpen;

});
