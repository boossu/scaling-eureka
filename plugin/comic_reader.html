<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes">
<title>漫画阅读器</title>
<style>
/* Exact theme tokens from the beautified web console (theme.css) */
:root{
  color-scheme:dark;
  --bg:#0b0d0f; --surface:#15181b; --surface2:#1e2225; --surface3:#272c30;
  --text:#eef1ee; --dim:#9aa39b; --faint:#666e67; --border:#262c2f;
  --accent:#3dd68c; --accent-dim:#123325; --fill-gs:#0e9f6e;
  --warm:#f2a93b; --warm-dim:#38280e; --fill-mt:#d97c16;
  --amber:#e8a33d; --bad:#e5604f; --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;min-height:2.25rem;border:none;background:none;color:inherit;cursor:pointer}
img{display:block}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#app{max-width:72rem;margin:0 auto;padding:0 12px 96px}
.hidden{display:none!important}
/* ---------- rule cards ---------- */
#rules{padding-top:16px}
.rule-row{display:flex;flex-wrap:wrap;gap:10px}
.rule-card{flex:1;min-width:160px;display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1px solid var(--border);background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.25);text-align:left;transition:all .15s}
.rule-card:active{transform:scale(.98)}
.rule-card.active-gs{border-color:var(--accent);background:var(--accent-dim);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.rule-card.active-mt{border-color:var(--warm);background:var(--warm-dim);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.rule-badge{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:20px;font-weight:700;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.rule-badge.gs{background:var(--fill-gs)}
.rule-badge.mt{background:var(--fill-mt)}
.rule-meta{min-width:0;flex:1}
.rule-title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:600;color:#fff}
.rule-author{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--dim)}
.rule-file{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;color:var(--faint);font-family:ui-monospace,Menlo,Consolas,monospace}
.rule-dot{flex:none;width:8px;height:8px;border-radius:50%;margin-left:auto}
.rule-dot.gs{background:var(--accent)}
.rule-dot.mt{background:var(--warm)}
.import-btn{flex:1;min-width:140px;display:flex;align-items:center;justify-content:center;padding:12px;border-radius:16px;border:1px dashed var(--border);background:var(--surface);font-size:14px;color:var(--dim)}
.import-btn:active{color:var(--text)}
.home-btn{flex:none;display:flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:16px;border:1px solid var(--border);background:var(--surface);font-size:14px;font-weight:600;color:var(--text)}
.home-btn:active{transform:scale(.98)}
#pastePanel{margin-top:10px;border-radius:16px;border:1px solid var(--border);background:var(--surface);padding:12px}
#pasteJson{width:100%;min-height:120px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:10px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.paste-btns{display:flex;gap:8px;margin-top:10px}
.paste-btns button{flex:1;border-radius:10px;padding:10px;font-size:14px;font-weight:600}
#pasteImport{background:var(--fill-gs);color:#fff}
#pasteCancel{background:var(--surface2);color:var(--dim);box-shadow:inset 0 0 0 1px var(--border)}
#importErr{margin-top:8px;font-size:14px;color:var(--bad)}
/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:16px}
.chip{border-radius:9999px;padding:6px 14px;font-size:14px;background:var(--surface);color:var(--dim);box-shadow:inset 0 0 0 1px var(--border);transition:all .15s}
.chip:active{transform:scale(.95)}
.chip.on-gs{background:var(--fill-gs);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(14,159,110,.4)}
.chip.on-mt{background:var(--fill-mt);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(217,124,22,.4)}
.mt-rows{padding-top:16px;display:flex;flex-direction:column;gap:10px}
.mt-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.mt-row .lbl{flex:none;width:36px;font-size:12px;font-weight:500;color:var(--faint)}
.chip.sm{padding:6px 12px;font-size:12px}
/* ---------- sections & cards ---------- */
.sec{padding-top:16px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:15px;font-weight:700;color:#fff}
.sec-h::before{content:"";width:4px;height:16px;border-radius:9999px;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);column-gap:10px;row-gap:16px}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{min-width:0;text-align:left;transition:transform .15s}
.card:active{transform:scale(.98)}
.cover{position:relative;width:100%;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--surface2);box-shadow:0 4px 14px rgba(0,0,0,.35);box-shadow:0 4px 14px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.05)}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--surface2);color:var(--dim)}
.cover .ph b{font-size:24px;color:var(--faint)}
.cover .ph span{font-size:10px;line-height:1.2;text-align:center;padding:0 4px}
.cover.loading{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.card-t{margin-top:6px;font-size:13px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-d{margin-top:2px;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skel-grid{display:grid;grid-template-columns:repeat(3,1fr);column-gap:10px;row-gap:16px}
@media(min-width:640px){.skel-grid{grid-template-columns:repeat(4,1fr)}}
.skel-c{width:100%;aspect-ratio:2/3;border-radius:12px;background:var(--surface2);animation:pulse 1.2s ease-in-out infinite}
.skel-t{margin-top:8px;height:12px;width:80%;border-radius:4px;background:var(--surface2);animation:pulse 1.2s ease-in-out infinite}
.skel-d{margin-top:6px;height:10px;width:60%;border-radius:4px;background:var(--surface2);animation:pulse 1.2s ease-in-out infinite}
.empty{border:1px dashed var(--border);border-radius:16px;background:var(--surface);padding:40px 16px;text-align:center}
.empty b{display:block;font-size:24px;color:var(--faint)}
.empty p{margin-top:8px;font-size:14px;color:var(--dim)}
.errbox{border:1px solid rgba(229,96,79,.5);border-radius:16px;background:var(--surface);padding:20px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.errbox p{font-size:14px;color:var(--bad)}
.retry{margin-top:12px;border-radius:9999px;background:var(--surface2);padding:8px 20px;font-size:14px;box-shadow:inset 0 0 0 1px var(--border)}
.retry:active{transform:scale(.95)}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;padding-top:20px}
.pager button{border-radius:9999px;background:var(--surface);padding:8px 20px;font-size:14px;box-shadow:inset 0 0 0 1px var(--border)}
.pager button:disabled{opacity:.4}
.pager button:active{transform:scale(.95)}
.pager span{font-size:14px;color:var(--dim);font-family:ui-monospace,Menlo,Consolas,monospace}
/* ---------- detail ---------- */
.backbtn{margin:16px 0 12px;border-radius:9999px;background:var(--surface);padding:6px 16px;font-size:14px;box-shadow:inset 0 0 0 1px var(--border)}
.backbtn:active{transform:scale(.95)}
.panel{border-radius:16px;border:1px solid var(--border);background:var(--surface);padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.panel-top{display:flex;gap:16px}
.panel-cover{flex:none;width:128px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.35);background:var(--surface2)}
@media(min-width:640px){.panel-cover{width:160px}}
.panel-cover img{width:100%;height:100%;object-fit:cover}
.panel-info{min-width:0}
.panel-info h2{font-size:20px;font-weight:700;line-height:1.4;color:#fff}
.panel-info .au{margin-top:6px;font-size:14px;color:var(--dim)}
.status-badge{display:inline-block;margin-top:8px;border-radius:9999px;background:var(--accent-dim);padding:2px 10px;font-size:12px;font-weight:500;color:var(--accent)}
.tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.tags span{border-radius:9999px;background:var(--surface2);padding:2px 8px;font-size:11px;color:var(--dim)}
.panel-meta{margin-top:8px;font-size:11px;color:var(--faint);font-family:ui-monospace,Menlo,Consolas,monospace}
.panel-desc{margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:14px;line-height:1.7;color:var(--dim)}
.ch-head{display:flex;align-items:center;gap:8px;margin-top:20px}
.ch-head h3{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:#fff}
.ch-head h3::before{content:"";width:4px;height:16px;border-radius:9999px;background:var(--accent)}
.ch-head .cnt{font-size:12px;font-weight:400;color:var(--faint)}
.ch-head button{margin-left:auto;border-radius:9999px;background:var(--surface);padding:6px 14px;font-size:12px;box-shadow:inset 0 0 0 1px var(--border)}
.ch-head button:active{transform:scale(.95)}
.ch-grid{margin-top:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:52vh;overflow-y:auto;padding-right:4px}
@media(min-width:640px){.ch-grid{grid-template-columns:repeat(6,1fr)}}
.ch-grid button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:8px;background:var(--surface);padding:10px 6px;font-size:12px;text-align:center;box-shadow:inset 0 0 0 1px var(--border);transition:all .15s}
.ch-grid button:active{transform:scale(.97)}
.ch-grid button.cur{background:var(--accent-dim);color:var(--accent);font-weight:600}
/* ---------- reader ---------- */
#reader{padding-top:12px}
.r-top{position:sticky;top:8px;z-index:20;border-radius:16px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.55);padding:8px 12px;box-shadow:0 8px 24px rgba(0,0,0,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.r-top-row{display:flex;align-items:center;gap:8px}
.r-top-row .r-back{flex:none;border-radius:9999px;background:rgba(255,255,255,.1);padding:6px 14px;font-size:14px;color:#fff}
.r-top-row .r-back:active{transform:scale(.95)}
.r-mid{flex:1;min-width:0;text-align:center}
.r-mid .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:600;color:#fff}
.r-mid .s{font-size:11px;color:rgba(255,255,255,.6);font-family:ui-monospace,Menlo,Consolas,monospace}
.r-note{margin-top:4px;text-align:center;font-size:11px;color:var(--amber);font-family:ui-monospace,Menlo,Consolas,monospace}
.r-imgs{display:flex;flex-direction:column;padding-bottom:96px}
.r-imgs img{width:100%;height:auto}
.r-imgs .ph{width:100%;aspect-ratio:2/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--surface2);color:var(--dim)}
.r-imgs .ph b{font-size:24px;color:var(--faint)}
.r-imgs .ph span{font-size:12px}
.r-loading{padding:40px 0;text-align:center}
.r-loading .sk{margin:0 auto;width:66%;max-width:320px;aspect-ratio:2/3;border-radius:12px;background:var(--surface2);animation:pulse 1.2s ease-in-out infinite}
.r-loading p{margin-top:16px;font-size:14px;color:var(--dim);font-family:ui-monospace,Menlo,Consolas,monospace}
.r-nav{position:fixed;left:0;right:0;bottom:16px;z-index:40;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.r-nav-in{pointer-events:auto;display:flex;align-items:center;gap:4px;border-radius:9999px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.6);padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.r-nav-in button{border-radius:9999px;padding:8px 16px;font-size:14px;color:#fff;transition:all .15s}
.r-nav-in button:active{transform:scale(.95)}
.r-nav-in button.mid{background:rgba(255,255,255,.12);font-weight:500}
/* ---------- toast & log ---------- */
#toast{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:0 24px;pointer-events:none}
#toast .in{max-width:86vw;border-radius:9999px;background:rgba(0,0,0,.75);padding:10px 20px;text-align:center;font-size:14px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.5);box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.15);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#log{margin-top:16px;border-radius:16px;border:1px solid var(--border);background:var(--surface);overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#log .lh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
#log .lh h2{font-size:13px;font-weight:600;color:var(--dim)}
#log .lh h2 span{font-size:11px;color:var(--faint);font-family:ui-monospace,Menlo,Consolas,monospace}
#log .lh .btns{display:flex;gap:6px}
#log .lh button{border-radius:9999px;padding:4px 10px;font-size:12px;color:var(--dim);box-shadow:inset 0 0 0 1px var(--border)}
#log ol{max-height:46vh;overflow-y:auto;border-top:1px solid var(--border);padding:6px 12px;list-style:none}
#log li{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);padding:6px 0}
#log li:last-child{border-bottom:none}
#log .dot{flex:none;width:6px;height:6px;border-radius:50%}
#log .dot.ok{background:var(--accent)}
#log .dot.bad{background:var(--bad)}
#log .tm{flex:none;font-size:11px;color:var(--faint);font-family:ui-monospace,Menlo,Consolas,monospace}
#log .lb{flex:none;font-size:12px;font-weight:500}
#log .dt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--dim)}
#log .dt.bad{color:var(--bad)}
#log .ms{flex:none;font-size:10px;color:var(--faint);font-family:ui-monospace,Menlo,Consolas,monospace}
#log .none{padding:16px 0;text-align:center;font-size:12px;color:var(--faint)}
</style>
</head>
<body>
<div id="app">
  <section id="rules" aria-label="已导入规则"><div class="rule-row" id="ruleRow"></div><div id="importErr"></div><div id="pastePanel" class="hidden"><textarea id="pasteJson" rows="6" placeholder="粘贴小程序规则 JSON（把规则文件全文粘贴到这里）…" spellcheck="false"></textarea><div class="paste-btns"><button type="button" id="pasteImport">导入</button><button type="button" id="pasteCancel">取消</button></div></div></section>
  <main id="main"></main>
  <aside id="log" aria-label="请求日志">
    <div class="lh"><h2>请求日志 <span id="logCount">0 条</span></h2><div class="btns"><button type="button" id="logToggle">收起</button><button type="button" id="logClear">清空</button></div></div>
    <ol id="logList"></ol>
  </aside>
</div>
<div id="toast" class="hidden"><div class="in" id="toastIn"></div></div>
<input type="file" id="fileInput" accept=".json,application/json" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden">
<script>
"use strict";
var PLUGIN_VERSION = 3;
/* ============================================================
   漫画阅读器 JS —— 浏览器控制台（engine.ts + App.tsx）的完整复刻。
   纯香草 JS，无外部依赖。直接 fetch 接口，不走任何代理。
   ============================================================ */

/* ---------------- 光社 hs 库（engine.ts 原样移植） ---------------- */
var GS_HOST = "https://m.g-mh.org";
var GS_API = "https://v2.apikk.top";
var GS_IMG_HOST = { "1": "https://c-nd1-1.6wm.top", "2": "https://c-nd2-1.6wm.top", "3": "https://c-nd3-1.6wm.top" };
var GS_CATS = [
  { k: "fuchou", n: "复仇" }, { k: "gufeng", n: "古风" }, { k: "qihuan", n: "奇幻" },
  { k: "nixi", n: "逆袭" }, { k: "yineng", n: "异能" }, { k: "chuanyue", n: "穿越" },
  { k: "rexue", n: "热血" }, { k: "chunai", n: "纯爱" }, { k: "xitong", n: "系统" },
  { k: "zhongsheng", n: "重生" }, { k: "maoxian", n: "冒险" }, { k: "lingyi", n: "灵异" },
  { k: "lianai", n: "恋爱" }, { k: "xuanhuan", n: "玄幻" }, { k: "kehuan", n: "科幻" },
  { k: "xuanyi", n: "悬疑" }, { k: "xiuxian", n: "修仙" }, { k: "zhandou", n: "战斗" }
];
function gsCatName(k) { for (var i = 0; i < GS_CATS.length; i++) if (GS_CATS[i].k === k) return GS_CATS[i].n; return k; }
function norm(s) {
  var out = String(s == null ? "" : s);
  out = out.replace(/<[^>]+>/g, " ");
  out = out.replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&quot;/g, '"')
    .replace(/&#39;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">");
  out = out.replace(/&#(\d{2,5});?/g, function (a, d) { var n = parseInt(d, 10); return (n > 31 && n < 65536) ? String.fromCharCode(n) : a; });
  return out.replace(/\s+/g, " ").replace(/^\s+|\s+$/g, "");
}
function fixPic(u) {
  var s = String(u || "").replace(/^\s+|\s+$/g, "");
  if (!s) return "";
  if (s.indexOf("//") === 0) s = "https:" + s;
  if (!/^https?:\/\//i.test(s)) s = GS_HOST + (s.charAt(0) === "/" ? s : "/" + s);
  return s;
}
function gsParseCards(html) {
  var out = [], seen = {};
  if (!html) return out;
  var blocks = String(html).split('class="pb-2"');
  for (var i = 1; i < blocks.length; i++) {
    var b = blocks[i] || "";
    var hm = b.match(/href="(\/manga\/[^"?#]+)"/);
    if (!hm || !hm[1]) continue;
    var slug = hm[1].replace(/^\/manga\//, "");
    if (!slug || seen[slug]) continue;
    seen[slug] = 1;
    var nm = norm(((b.match(/<h3[^>]*>([\s\S]*?)<\/h3>/) || [])[1] || ""));
    var pc = fixPic(((b.match(/<img[^>]*src="([^"]+)"/) || [])[1] || ""));
    out.push({ title: nm || slug, desc: "", pic: pc, ref: slug });
  }
  var re2 = /<a href="(\/manga\/[^"?#]+)"[^>]*class="slicarda"[^>]*>([\s\S]*?)<\/a>/g, m2;
  while ((m2 = re2.exec(String(html))) !== null) {
    var sl = (m2[1] || "").replace(/^\/manga\//, "");
    if (!sl || seen[sl]) continue;
    seen[sl] = 1;
    var body = m2[2] || "";
    var nm2 = norm(((body.match(/<h3[^>]*>([\s\S]*?)<\/h3>/) || [])[1] || ""));
    var pc2 = fixPic(((body.match(/<img[^>]*src="([^"]+)"/) || [])[1] || ""));
    var tip = norm(((body.match(/<p class="slicardtagp"[^>]*>([\s\S]*?)<\/p>/) || [])[1] || ""));
    out.push({ title: nm2 || sl, desc: tip, pic: pc2, ref: sl });
  }
  return out;
}
function gsParseHome(html) {
  var segs = String(html || "").split(/<h2 class="text-xl"[^>]*>/);
  var groups = [];
  for (var si = 1; si < segs.length; si++) {
    var seg = segs[si] || "";
    var nm = norm((seg.split("</h2>")[0] || ""));
    if (!nm) continue;
    var part = gsParseCards(seg);
    if (!part.length) continue;
    groups.push({ title: nm, items: part.slice(0, 9) });
  }
  return groups;
}
function gsParseDetailHtml(html, nameHint) {
  if (!html || html.length <= 1000) return null;
  var h1 = ((html.match(/<h1[^>]*>([\s\S]*?)<\/h1>/) || [])[1] || "");
  var midM = ((html.match(/id="bookmarkData"[^>]*data-mid="(\d+)"/) || [])[1] ||
    (html.match(/data-mid="(\d+)"/) || [])[1] || "");
  if (!midM) return null;
  var coverM = ((html.match(/id="bookmarkData"[^>]*data-cover="([^"]+)"/) || [])[1] || "");
  var tags = [], tseen = {};
  var tre = /href="\/manga-tag\/([a-z-]+)"/g, tr;
  while ((tr = tre.exec(html)) !== null) {
    var key = tr[1] || "";

function importRuleFromRaw(raw, fileName) {

function onImportFile(file) {

  reader.onload = function () {

function ruleDefFromJson(raw, fileName) {
  var title = typeof raw.title === "string" ? raw.title : "";
  var author = typeof raw.author === "string" ? raw.author : "";
  var pages = [];
  try { var parsed = typeof raw.pages === "string" ? JSON.parse(raw.pages) : raw.pages; if (Array.isArray(parsed)) pages = parsed; } catch (e) { pages = []; }
  var hs = null;
  for (var i = 0; i < pages.length; i++) if (pages[i] && pages[i].path === "hs") { hs = pages[i]; break; }
  if (hs && typeof hs.rule === "string") {
    var cats = [];
    var re = /\{\s*k:\s*'([^']+)',\s*n:\s*'([^']+)'\s*\}/g, m;
    while ((m = re.exec(hs.rule)) !== null) if (m[1] && m[2]) cats.push({ k: m[1], n: m[2] });
    return { id: "rule-" + Math.random().toString(36).slice(2, 9), title: title || "光社类规则", author: author, kind: "guangse", cats: cats.length ? cats : GS_CATS, fileName: fileName, badge: (title || "光").charAt(0), warm: false };
  }
  var url = typeof raw.url === "string" ? raw.url : "";
  if (url.indexOf("getcomicserch") >= 0 || url.indexOf("kaimanhua") >= 0) {
    return { id: "rule-" + Math.random().toString(36).slice(2, 9), title: title || "漫画台类规则", author: author, kind: "manhuatai", fileName: fileName, badge: (title || "漫").charAt(0), warm: true };
  }
  return null;
}

function parseShellUrl(u) {
  var s = String(u || "").trim();
  if (!s) return null;
  var m = s.match(/hiker:\/\/page\/read\?([^#]*)/);
  if (m) {
    var q = {};
    m[1].split("&").forEach(function (kv) { var p = kv.split("="); q[decodeURIComponent(p[0] || "")] = decodeURIComponent(p[1] || ""); });
    if (q.mid) return { kind: "gs", mid: q.mid, index: parseInt(q.i || "0", 10) || 0, slug: q.slug || "" };
  }
  if (s.indexOf("getchapterinfov2") >= 0) {
    var q2 = {};
    var qs2 = s.split("?")[1] || "";
    qs2.split("&").forEach(function (kv) { var p = kv.split("="); q2[decodeURIComponent(p[0] || "")] = decodeURIComponent(p[1] || ""); });
    if (q2.comic_id && q2.chapter_newid) return { kind: "mt", comicId: q2.comic_id, chapterId: q2.chapter_newid };
  }
  if (s.indexOf("pics://") === 0) {
    var imgs = s.substring(7).split("&&").map(function (x) { return x.trim(); }).filter(function (x) { return !!x; });
    if (imgs.length) return { kind: "pics", images: imgs };
  }
  if (s.charAt(0) === "[") {
    try {
      var arr = JSON.parse(s), list = [];
      for (var i = 0; i < arr.length; i++) {
        if (typeof arr[i] === "string") list.push(arr[i]);
        else if (arr[i] && typeof arr[i].url === "string") list.push(arr[i].url);
        else if (arr[i] && typeof arr[i].pic === "string") list.push(arr[i].pic);
      }
      if (list.length) return { kind: "pics", images: list };
    } catch (e) { /* not json */ }
  }
  if (/^https?:\/\/[^ ]+\.(jpg|jpeg|png|webp|gif)(\?[^ ]*)?$/i.test(s)) return { kind: "pics", images: [s] };
  return null;
}

  }
  if (d.kind === "mt") {
    state.ruleId = "mt";
    var r2 = rule();
    pushLog({ label: "壳子传入", url: url, ok: true, detail: "漫画台 comic_id=" + d.comicId + " 章节 " + d.chapterId, ms: 0 });
    /* 先拉详情取章节表，再进指定话 */
    request("详情接口·漫画台", mtDetailUrl(d.comicId), "mobile", function (t) { var dd = mtParseDetail(t); return "章节 " + (dd ? dd.chapters.length : 0) + " 话"; }).then(function (text) {
      var dd = mtParseDetail(text);
      if (!dd || !dd.chapters.length) throw new Error("详情接口没解析出数据");
      var detail2 = { ref: dd.comicId, title: dd.name || title || ("comic_id=" + d.comicId), author: "", cover: dd.cover || "", desc: dd.desc, status: "", tags: [], mid: "", chapters: dd.chapters };
      var idx2 = 0;
      for (var k = 0; k < dd.chapters.length; k++) if (dd.chapters[k].id === d.chapterId) { idx2 = k; break; }
      openChapter(r2, detail2, idx2);
    }).catch(function (e) { showToast(e.message || String(e)); });
    return true;
  }
  if (d.kind === "pics") {
    pushLog({ label: "壳子传入", url: url, ok: true, detail: "直接打开 " + d.images.length + " 张图", ms: 0 });
    openImagesDirect(d.images, title || "");
    return true;
  }
  return false;
}
/* ---------------- 启动 ---------------- */
function boot() {
  renderRuleRow();
  var pi = $("pasteImport"); if (pi) pi.addEventListener("click", importPastedJson);
  var pc = $("pasteCancel"); if (pc) pc.addEventListener("click", function () { var p = $("pastePanel"); if (p) p.classList.add("hidden"); $("importErr").textContent = ""; });
  $("logToggle").addEventListener("click", function () { state.logOpen = !state.logOpen; renderLog(); });
  $("logClear").addEventListener("click", function () { state.logs = []; renderLog(); });
  $("fileInput").addEventListener("change", function () {
    var f = this.files && this.files[0];
    if (f) onImportFile(f);
    this.value = "";
  });
  pushLog({ label: "导入小程序", url: "_____2_i9q0.json（页面内嵌）", ok: true, detail: "光社漫画 · WorkBuddy · " + GS_CATS.length + " 个分类", ms: 0 });
  pushLog({ label: "导入小程序", url: "___1_9dfy.json（页面内嵌）", ok: true, detail: "漫画台 · zhao · 16 个分类", ms: 0 });
  /* 壳子传入（WebView 桥）优先；其次 URL 参数（浏览器自测用） */
  var initUrl = "", initTitle = "";
  try {
    if (window.ComicBridge && typeof window.ComicBridge.getInitialUrl === "function") initUrl = window.ComicBridge.getInitialUrl() || "";
    if (window.ComicBridge && typeof window.ComicBridge.getInitialTitle === "function") initTitle = window.ComicBridge.getInitialTitle() || "";
  } catch (e) { /* no bridge */ }
  if (!initUrl) {
    try {
      var qs = new URLSearchParams(window.location.search);
      initUrl = qs.get("open") || "";
      initTitle = qs.get("title") || "";
    } catch (e) { /* no query */ }
  }
  if (initUrl && openShellDeepLink(initUrl, initTitle)) return;
  loadBrowseForRule(rule());
}
if (typeof document !== "undefined") {
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
}
