  E.seekFill.style.width = (progress * 100) + "%";
  E.seekDot.style.left = (progress * 100) + "%";
  E.seekBar.setAttribute("aria-valuemax", String(Math.round(player.duration)));
  E.seekBar.setAttribute("aria-valuenow", String(Math.round(displayTime)));
  E.timeLabel.textContent = fmtTime(displayTime) + " / " + fmtTime(player.duration);
  E.countLabel.textContent = "第 " + (player.index + 1) + " / " + player.detail.episodes.length + " 集";
  E.prevBtn.disabled = player.index <= 0;
  E.nextBtn.disabled = player.index >= player.detail.episodes.length - 1;
  E.rateBtn.textContent = player.rate + "x";
  E.volBtn.textContent = player.muted ? "静音" : "音量";
  E.volRange.value = String(player.muted ? 0 : player.volume);
  E.topTitle.textContent = "第 " + player.detail.episodes[player.index].num + " 集";
  E.closeBtn.textContent = player.fullscreen ? "退出全屏" : "‹ 返回详情";
  $("playerCrumb").textContent = player.detail.title + " · 第 " + (player.index + 1) + " / " + player.detail.episodes.length + " 集";
}

function renderEpSheet() {
  var E = playerEls();
  E.sheetGrid.innerHTML = "";
  player.detail.episodes.forEach(function (ep, i) {
    var b = el("button", "ep-sheet-btn" + (i === player.index ? " on" : ""), String(ep.num));
    b.type = "button";
    b.addEventListener("click", function () {
      E.sheet.classList.add("hidden");
      playEpisode(i);
    });
    E.sheetGrid.appendChild(b);
  });
  $("epSheetTitle").textContent = "选集（" + player.detail.episodes.length + " 集）";
}

function togglePlay() {
  var b = getBackend();
  if (!b) return;
  if (b.isPaused()) {
    player.needGesture = false;
    Promise.resolve(b.play()).catch(function () { player.needGesture = true; renderCenter(); });
    setPlaying(true);
    flashIcon("play");
  } else {
    b.pause();
    setPlaying(false);
    flashIcon("pause");
  }
  clearTimeout(player.flashTimer);
  player.flashTimer = setTimeout(function () { renderCenter(); }, 600);
  pokeControls();
  renderCenter();
}
function flashIcon(kind) {
  /* 中央闪一下播/停图标：复用 renderCenter 的暂停态按钮即可，600ms 后由定时器恢复。 */
  renderCenter();
}
function seekTo(t) {
  var b = getBackend();
  if (!b) return;
  var d = b.getDuration() || player.duration;
  var clamped = Math.max(0, Math.min(t, d));
  b.seek(clamped);
  player.time = clamped;
  renderBottom();
}
function applyVolume(v, m) {
  player.volume = v; player.muted = m;
  var b = getBackend();
  if (b) { b.setVolume(v); b.setMuted(m); }
  renderBottom();
}
function cycleRate() {
  var i = SPEEDS.indexOf(player.rate);
  var next = SPEEDS[(i + 1) % SPEEDS.length] || 1;
  player.rate = next;
  var b = getBackend();
  if (b) b.setRate(next);
  renderBottom();
}

function getFallbackPlayer() {
  var canvas = $("fbCanvas");
  if (!canvas) return null;
  if (!player.fallback) {
    var dispatch = {
      onState: function (s, d) { if (player.fbEvents.onState) player.fbEvents.onState(s, d); },
      onTime: function (t, d) { if (player.fbEvents.onTime) player.fbEvents.onTime(t, d); },
      onFirstFrame: function (info) { if (player.fbEvents.onFirstFrame) player.fbEvents.onFirstFrame(info); },
      onError: function (m) { if (player.fbEvents.onError) player.fbEvents.onError(m); },
      onEnded: function () { if (player.fbEvents.onEnded) player.fbEvents.onEnded(); },
      onLoadProgress: function (l, t) { if (player.fbEvents.onLoadProgress) player.fbEvents.onLoadProgress(l, t); },
      onNeedGesture: function () { if (player.fbEvents.onNeedGesture) player.fbEvents.onNeedGesture(); },
      onAudio: function (s, d) { if (player.fbEvents.onAudio) player.fbEvents.onAudio(s, d); }
    };
    player.fallback = new HevcFallbackPlayer(canvas, dispatch);
  }
  return player.fallback;
}

function startFallback(srcs, token) {
  var fb = getFallbackPlayer();
  if (!fb) return Promise.resolve();
  return fb.load(srcs).then(function (info) {
    if (token !== player.loadToken || !info) return;
    player.duration = info.duration;
    return fb.play().then(function () {
      if (token === player.loadToken) setPlaying(true);
    });
  }).catch(function (e) {
    if (token !== player.loadToken) return;
    if (e instanceof Error && e.message === NOT_HEVC_SENTINEL) {
      /* 这集不是 HEVC（如 H.264）：回落解不了，交回原生 <video>。只切一次，防两边来回跳。 */
      if (!player.h264Redirect) {
        player.h264Redirect = true;
        player.loadState = "";
        setMode("native");
        loadNative();
      } else {
        player.playError = "这一集原生也播不了（可能是地址过期），请回详情重进一次。";
        renderCenter();
      }
      return;
    }
    player.playError = e instanceof Error ? e.message : String(e);
    renderCenter();
  });
}

function loadNative() {
  var E = playerEls();
  var v = E.video;
  v.src = player.sources[player.srcIdx] || "";
  v.load();
  var p = v.play();
  if (p) p.catch(function () { player.needGesture = true; renderCenter(); });
}

function loadCurrentEpisode() {
  var token = player.loadToken;
  var ep = player.detail.episodes[player.index];
  player.sources = xyPlaySources(ep);
  player.srcIdx = 0;
  var useFallback = !canPlayHevcNative();
  if (useFallback) {
    setMode("fallback");
    return startFallback(player.sources, token);
  }
  setMode("native");
  loadNative();
  return Promise.resolve();
}

function playEpisode(index) {
  var detail = currentDetail;
  if (!detail || !detail.episodes[index]) return;
  var token = ++player.loadToken;
  player.detail = detail;
  player.index = index;
  player.h264Redirect = false;
  player.playing = false;
  player.time = 0;
  player.duration = detail.episodes[index].seconds || 0;
  player.loadState = ""; player.playError = ""; player.needGesture = false;
  player.seekPreview = null;
  setAudioStatus("unknown");
  setOrientation("portrait");
  $("epSheet").classList.add("hidden");
  showView("player");
  /* 点集数 = 立即播 + 竖屏全屏（手势窗口内先把全屏要下来）。换集不掉出全屏。 */
  enterFullscreen("portrait");
  player.fbEvents = {
    onState: function (s, detailMsg) {
      if (token !== player.loadToken) return;
      if (s === "loading") player.loadState = "正在加载…";
      else if (s === "ready") player.loadState = "";
      else if (s === "error") player.loadState = "";
      else if (detailMsg) player.loadState = detailMsg;
      if (s === "playing") setPlaying(true);
      if (s === "paused" || s === "ended") setPlaying(false);
      renderCenter();
    },
    onTime: function (t, d) {
      if (token !== player.loadToken) return;
      if (!player.dragging) player.time = t;
      if (d > 0) player.duration = d;
      renderBottom();
    },
    onFirstFrame: function (info) {
      if (token !== player.loadToken) return;
      player.duration = info.duration;
      player.loadState = "";
      renderCenter();
    },
    onError: function (msg) {
      if (token !== player.loadToken) return;
      player.playError = msg;
      renderCenter();
    },
    onEnded: function () {
      if (token !== player.loadToken) return;
      setPlaying(false);
    },
    onLoadProgress: function (loaded, total) {
      if (token !== player.loadToken) return;
      player.loadState = total > 0
        ? "正在加载 " + (loaded / 1048576).toFixed(1) + " / " + (total / 1048576).toFixed(1) + " MB"
        : "正在加载 " + (loaded / 1048576).toFixed(1) + " MB";
      renderCenter();
    },
    onNeedGesture: function () {
      if (token !== player.loadToken) return;
      player.needGesture = true;
      renderCenter();
    },
    onAudio: function (s) {
      if (token !== player.loadToken) return;
      setAudioStatus(s);
    }
  };
  renderCenter();
  renderBottom();
  renderEpSheet();
  loadCurrentEpisode();
}

function exitPlayer() {
  player.loadToken++;
  if (player.fallback) { try { player.fallback.destroy(); } catch (e) {} player.fallback = null; }
  var v = $("nativeVideo");
  if (v) { try { v.pause(); } catch (e) {} v.removeAttribute("src"); try { v.load(); } catch (e) {} }
  if (document.fullscreenElement === $("playerWrap")) exitFullscreen();
  clearInterval(player.progressTimer);
  clearTimeout(player.hideTimer);
  clearTimeout(player.flashTimer);
}

function onVideoError() {
  if (player.srcIdx + 1 < player.sources.length) {
    player.srcIdx += 1;
    loadNative();
    return;
  }
  if (player.h264Redirect) {
    player.playError = "原生播不了这一集（可能是地址过期）；WASM 回落只解 HEVC。";
    renderCenter();
    return;
  }
  player.playError = "";
  setMode("fallback");
  startFallback(player.sources, player.loadToken);
}

function bindPlayer() {
  var E = playerEls();
  E.topBar = $("playerTop");
  E.video.addEventListener("click", togglePlay);
  E.canvas.addEventListener("click", togglePlay);
  E.video.addEventListener("play", function () { setPlaying(true); });
  E.video.addEventListener("playing", function () { setPlaying(true); setAudioStatus("ok"); });
  E.video.addEventListener("pause", function () { setPlaying(false); });
  E.video.addEventListener("ended", function () { setPlaying(false); });
  E.video.addEventListener("error", onVideoError);
  E.closeBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (player.fullscreen) exitFullscreen();
    else { showView("detail"); renderDetail(); }
  });
  $("btnBackPlayerTop").addEventListener("click", function () { showView("detail"); renderDetail(); });
  E.wrap.addEventListener("pointermove", pokeControls);
  E.playBtn.addEventListener("click", togglePlay);
  E.prevBtn.addEventListener("click", function () { if (player.index > 0) playEpisode(player.index - 1); });
  E.nextBtn.addEventListener("click", function () { if (player.index < player.detail.episodes.length - 1) playEpisode(player.index + 1); });
  E.epBtn.addEventListener("click", function () { E.sheet.classList.toggle("hidden"); });
  $("btnEpSheetClose").addEventListener("click", function () { E.sheet.classList.add("hidden"); });
  E.rateBtn.addEventListener("click", cycleRate);
  E.rotBtn.addEventListener("click", function () {
    var next = player.orientation === "portrait" ? "landscape" : "portrait";
    setOrientation(next);
    if (document.fullscreenElement) lockOrientation(next);
    else enterFullscreen(next);
  });
  E.fsBtn.addEventListener("click", function () {
    if (player.fullscreen) exitFullscreen();
    else enterFullscreen(player.orientation);
  });
  E.volBtn.addEventListener("click", function () { applyVolume(player.volume, !player.muted); });
  E.volRange.addEventListener("input", function () { applyVolume(Number(E.volRange.value), false); });
  E.bottom.addEventListener("click", function (e) { e.stopPropagation(); });

  var onSeekPointer = function (e) {
    var rect = E.seekBar.getBoundingClientRect();
    var ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    var t = ratio * (player.duration || 0);
    if (e.type === "pointerdown") {
      player.dragging = true;
      try { E.seekBar.setPointerCapture(e.pointerId); } catch (err) {}
      player.seekPreview = t;
      renderBottom();
    } else if (player.dragging) {
      player.seekPreview = t;
      renderBottom();
    }
    if (e.type === "pointerup" || e.type === "pointercancel") {
      player.dragging = false;
      player.seekPreview = null;
      seekTo(t);
    }
  };
  E.seekBar.addEventListener("pointerdown", onSeekPointer);
  E.seekBar.addEventListener("pointermove", onSeekPointer);
  E.seekBar.addEventListener("pointerup", onSeekPointer);
  E.seekBar.addEventListener("pointercancel", onSeekPointer);

  document.addEventListener("fullscreenchange", function () {
    player.fullscreen = !!document.fullscreenElement;
    renderBottom();
  });
  var onOrient = function () {
    if (!document.fullscreenElement) return;
    var t = (screen.orientation && screen.orientation.type) || "";
    if (t.indexOf("landscape") === 0) setOrientation("landscape");
    else if (t.indexOf("portrait") === 0) setOrientation("portrait");
  };
  try { if (screen.orientation) screen.orientation.addEventListener("change", onOrient); } catch (e) {}
  window.addEventListener("orientationchange", onOrient);

  player.progressTimer = setInterval(function () {
    if (!$("viewPlayer") || $("viewPlayer").classList.contains("hidden")) return;
    var b = getBackend();
    if (!b) return;
    if (!player.dragging) player.time = b.getTime();
    var d = b.getDuration();
    if (d > 0) player.duration = d;
    setPlaying(!b.isPaused());
    renderBottom();
  }, 250);
}

/* ---------------- 启动 ---------------- */

function boot() {
  renderChips();
  bindPlayer();
  setMode(canPlayHevcNative() ? "native" : "fallback");
  setAudioStatus("unknown");
  setOrientation("portrait");
  loadRuleCats();
  $("searchForm").addEventListener("submit", function (e) {
    e.preventDefault();
    loadSearch($("searchInput").value);
  });
  $("btnRetry").addEventListener("click", function () {
    headersCache = null;
    if (browse.isSearch) loadSearch(browse.query);
    else if (cats[0]) loadCategory(browse.nav || cats[0].k, browse.page || 1);
  });
  $("btnBackDetail").addEventListener("click", function () { showView("browse"); });
  if (cats[0]) { browse.nav = cats[0].k; loadCategory(cats[0].k, 1); }
}

document.addEventListener("DOMContentLoaded", boot);

</script>
</body>
</html>
